<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="wax-drop">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#d4a0a6" flood-opacity="0.3"/>
    </filter>
    <clipPath id="env-clip">
      <rect x="12" y="30" width="76" height="46" rx="4"/>
    </clipPath>
  </defs>

  <!-- 左上枝条：根部在信封左侧中间偏上 (12,48)，S形紧贴边缘，顶端延申到信封上方中点 -->
  <g stroke="#6b9e4a" stroke-width="1.3" fill="none" stroke-linecap="round">
    <path d="M 12,48 C 6,42 4,34 8,28 C 12,22 18,22 20,28 C 22,34 16,38 14,34 C 12,30 14,24 20,18 C 28,11 38,9 46,10 C 50,10.5 52,12 54,14"/>
    <!-- 叶子：沿S形分布 -->
    <path d="M 5,32 Q -1,28 1,22 Q 7,26 5,32 Z"/>
    <path d="M 20,28 Q 26,24 26,18 Q 20,20 20,28 Z"/>
    <path d="M 18,18 Q 16,11 22,8 Q 26,13 18,18 Z"/>
    <path d="M 32,12 Q 36,6 38,12 Q 33,15 32,12 Z"/>
    <path d="M 46,10 Q 48,4 52,6 Q 50,11 46,10 Z"/>
  </g>

  <!-- 右下枝条：根部在右侧边缘中间偏下 (88,60)，S形紧贴边缘，底端延申到信封下方中点 -->
  <g stroke="#6b9e4a" stroke-width="1.3" fill="none" stroke-linecap="round">
    <path d="M 88,60 C 94,66 96,74 92,80 C 88,86 82,86 80,80 C 78,74 84,70 86,74 C 88,78 86,84 80,90 C 72,97 62,99 54,98 C 50,97.5 48,96 46,94"/>
    <!-- 叶子：沿S形分布 -->
    <path d="M 95,68 Q 101,64 99,58 Q 93,62 95,68 Z"/>
    <path d="M 80,80 Q 74,84 74,90 Q 80,88 80,80 Z"/>
    <path d="M 82,90 Q 84,97 78,100 Q 74,95 82,90 Z"/>
    <path d="M 68,96 Q 64,102 62,96 Q 67,93 68,96 Z"/>
    <path d="M 54,98 Q 52,104 48,102 Q 50,97 54,98 Z"/>
  </g>

  <g clip-path="url(#env-clip)">
    <rect x="12" y="30" width="76" height="46" fill="#fff5f7"/>
    <polygon points="12,76 50,48 88,76" fill="#ffe4e8" stroke="#ffb6c1" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="12,30 46,53 12,76" fill="#ffd1dc" stroke="#ffb6c1" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="88,30 54,53 88,76" fill="#ffd1dc" stroke="#ffb6c1" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="12,30 50,56 88,30" fill="#fffafb" stroke="#ff9aae" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- 信封最外围的圆角轮廓线 -->
  <rect x="12" y="30" width="76" height="46" rx="4" fill="none" stroke="#ff9aae" stroke-width="2"/>

  <!-- 中间火漆印章❁ -->
  <circle cx="50" cy="56" r="8.5" fill="#e8b4b8" filter="url(#wax-drop)"/>
  <circle cx="50" cy="56" r="6.5" fill="#f2c9cc"/>
  <text x="50" y="60.5" font-size="15" font-family="Arial, sans-serif" text-anchor="middle" fill="#fdf0e0">❁</text>
</svg>